name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Install and test
        run: |
          pnpm i --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm verify:release

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"
          registry-url: https://registry.npmjs.org/
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Install deps
        run: pnpm i --frozen-lockfile
      - name: Validate release tag
        run: |
          node -e '
            const identifier = "(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)";
            const semver = new RegExp(
              `^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)` +
              `(?:-${identifier}(?:\\.${identifier})*)?` +
              "(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$",
            );
            const tag = process.env.GITHUB_REF_NAME;
            const packageVersion = require("./package.json").version;
            const jsrVersion = require("./jsr.json").version;
            if (!semver.test(tag) || tag.slice(1) !== packageVersion || packageVersion !== jsrVersion) {
              console.error({ tag, packageVersion, jsrVersion });
              process.exit(1);
            }
          '
      - name: Install exact npm
        run: npm install --global npm@12.0.2
      - name: Preflight package and JSR
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm verify:release
          pnpm exec jsr publish --dry-run
      - name: Prepare exact npm artifact
        id: npm-artifact
        shell: bash
        run: |
          set -euo pipefail
          pack_json=$(npm pack --json --pack-destination "$RUNNER_TEMP")
          metadata=$(PACK_JSON="$pack_json" node -e '
            const parsed = JSON.parse(process.env.PACK_JSON);
            const entry = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0];
            if (!entry || typeof entry.filename !== "string" || typeof entry.integrity !== "string") {
              throw new Error("npm pack did not return filename and integrity");
            }
            process.stdout.write(`${entry.filename}\n${entry.integrity}`);
          ')
          filename=$(printf '%s\n' "$metadata" | sed -n '1p')
          local_integrity=$(printf '%s\n' "$metadata" | sed -n '2p')
          tarball="$RUNNER_TEMP/$filename"
          test -f "$tarball"

          package_name=$(node -p 'require("./package.json").name')
          package_version=$(node -p 'require("./package.json").version')
          error_log="$RUNNER_TEMP/npm-view-error.log"
          set +e
          remote_json=$(npm view "$package_name@$package_version" dist.integrity --json 2>"$error_log")
          view_status=$?
          set -e

          if [ "$view_status" -eq 0 ]; then
            remote_integrity=$(node -e '
              const value = JSON.parse(process.argv[1]);
              if (typeof value !== "string" || !value) throw new Error("registry returned no integrity");
              process.stdout.write(value);
            ' "$remote_json")
            if [ "$remote_integrity" != "$local_integrity" ]; then
              echo "Published npm integrity does not match the local artifact." >&2
              exit 1
            fi
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq '(^|[^A-Z0-9_])E404([^A-Z0-9_]|$)' "$error_log"; then
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          else
            cat "$error_log" >&2
            exit "$view_status"
          fi

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "integrity=$local_integrity" >> "$GITHUB_OUTPUT"
      - name: Publish to NPM via OIDC
        shell: bash
        run: |
          if [ "${{ steps.npm-artifact.outputs['already-published'] }}" = "true" ]; then
            echo "npm artifact is already published with matching integrity; skipping npm publish."
          else
            npm publish "${{ steps.npm-artifact.outputs.tarball }}"
          fi
      - name: Publish to JSR
        run: pnpm exec jsr publish
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
